entities:
  - system: crisis-mars-online
    core:
      status: provisional
      confidence: confirmed
      title: Crisis Mars Online
      summary: >-
        Browser client for an eight-to-eighteen-player megagame, run fully
        remotely with voice happening elsewhere. One facilitator's browser tab
        holds the only authoritative game state; every other participant is a
        PeerJS client.
      goals:
        - Let a published paper megagame be run without a venue, wall maps, or dice.
        - Track the boards and do the arithmetic so nobody has to police it mid-negotiation.
        - Leave every judgement call the paper game leaves to a human with that human — adjudication is the facilitator's, always.
        - Survive a facilitator refreshing or crashing their browser without ending the game.
      references:
        - browser-host-authority
        - no-bundler-static-hosting
        - gamespec-is-spec-js-is-implementation
        - rules-core-is-pure
        - human-adjudication
      open_questions:
        - Whether the Discord bot contract (docs and a conformance test, as RBO has) is worth writing before the first live run.
        - What a first playtest changes about the adjudication panel's density.

  - decision: browser-host-authority
    core:
      status: accepted
      confidence: confirmed
      title: The Facilitator's Browser Is Authoritative
      summary: >-
        A single browser tab, opened by the primary facilitator, owns the only
        copy of game state. Players and the co-facilitator are clients that hold
        redacted projections of it.
      rationale:
        - The facilitator is already the trusted umpire in the paper game, so trusting their client is not a new assumption.
        - Because the host legitimately sees everything, the redaction layer only has to stop private material reaching other players.
        - A dedicated server would need hosting, an operator, and a deploy story for a game that runs a handful of times a year.
        - A peer mesh with CRDTs cannot express "the umpire decides", which is the game's central mechanism.
      assumptions:
        - The facilitator's machine stays awake and online for roughly two hours.
      references:
        - host-tab-lost

  - decision: no-bundler-static-hosting
    core:
      status: accepted
      confidence: confirmed
      title: No Build Step
      summary: >-
        Vanilla ES modules and custom elements, committed as served, published
        to GitHub Pages from a generated branch by CI.
      rationale:
        - What is committed is what runs, so a live-event hotfix is a commit rather than a build and a deploy.
        - There is no toolchain to break on the morning of a game.
        - PeerJS is vendored rather than loaded from a CDN so the page is same-origin and survives a CDN outage.

  - decision: gamespec-is-spec-js-is-implementation
    core:
      status: accepted
      confidence: confirmed
      title: gamespec Specifies, JavaScript Implements
      summary: >-
        The rules of record are encoded in the crisis_mars gamespec, in Python,
        in the analogue-projects repository. The shipped rules engine is
        JavaScript in this repository. The generated dataset carries provenance,
        and conformance vectors will keep the two honest as mechanisms land.
      rationale:
        - Running the Python mechanisms in the browser would mean shipping a Python runtime to eighteen clients, which is not a trade worth making for a rules engine measured in hundreds of lines.
        - Two independent implementations of the same rules will drift unless something forces them together, so the Python mechanisms generate input-and-expected-output vectors that the JavaScript test suite replays.
        - A rules disagreement therefore surfaces as a failing test rather than as an argument between players mid-action.
      assumptions:
        - The data export is run manually and its output committed; neither repository builds against the other.

  - decision: rules-core-is-pure
    core:
      status: accepted
      confidence: confirmed
      title: The Rules Core Is Pure
      summary: >-
        Everything under the rules module is pure functions over state and
        static data, with no transport, no persistence, and no DOM.
      rationale:
        - The host imports it to enforce the rules and the clients import it to grey out unavailable buttons; only a dependency-free core can be shared that way.
        - It makes the whole rule set testable in Node without a browser or a network.
        - Static data is passed as an argument rather than imported, so tests inject fixtures instead of mutating a global.
      references:
        - command-admission

  - decision: human-adjudication
    core:
      status: accepted
      confidence: confirmed
      title: The App Computes; The Facilitator Adjudicates
      summary: >-
        The app works out an action's Impact, names the band, and rolls the
        consequence die — but it never applies an effect to the boards without
        a facilitator confirming it.
      rationale:
        - The printed game is adjudicated by a human on every action, with difficulty and resource relevance left explicitly to judgement; automating the application would be inventing rules the print does not have.
        - "Derived values are never stored: the Impact total, the band and the marker's map location are computed when asked, so the boards and the arithmetic cannot disagree."
        - The facilitator confirm is a command like any other, so the log still answers "what did the umpire apply?".
